<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo motion storyboard frame</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 -40 200 256" width="100%" height="100%" role="img" aria-label="{{label}}">
<g style="opacity: {{f.slabO}}; transform: translate(0px, {{f.slabY}}px)">
<polygon points="100,113.3 175.7,157 100,200.7 24.3,157" style="fill: #F97316; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
<polygon points="24.3,168 100,211.7 100,200.7 24.3,157" style="fill: #FF5500; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
<polygon points="175.7,168 100,211.7 100,200.7 175.7,157" style="fill: #0D0D0D; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
<polyline points="38.3,155.8 72.1,175.4 74.9,183" style="fill: none; stroke: {{f.trace}}; stroke-width: 2"></polyline>
<polyline points="161.7,155.8 125.9,176.6 123.1,184.1" style="fill: none; stroke: {{f.trace}}; stroke-width: 2"></polyline>
<circle cx="76.5" cy="186.7" r="2.6" style="fill: none; stroke: {{f.trace}}; stroke-width: 1.8"></circle>
<circle cx="121.5" cy="187.8" r="2.6" style="fill: none; stroke: {{f.trace}}; stroke-width: 1.8"></circle>
</g>
<g style="opacity: {{f.botO}}; transform: translate(0px, {{f.botY}}px)">
<polygon points="60.2,111 100,88 139.8,111 100,134" style="fill: #F97316; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
<polygon points="60.2,111 100,134 100,180 60.2,157" style="fill: #FF5500; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
<polygon points="100,134 139.8,111 139.8,157 100,180" style="fill: #0D0D0D; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
</g>
<g style="opacity: {{f.topO}}; transform: translate(0px, {{f.topY}}px)">
<polygon points="60.2,43 100,20 139.8,43 100,66" style="fill: #F97316; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
<polygon points="60.2,43 100,66 100,112 60.2,89" style="fill: #FF5500; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
<polygon points="100,66 139.8,43 139.8,89 100,112" style="fill: #0D0D0D; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
</g>
<g style="opacity: {{f.wedO}}; transform: translate({{f.wedX}}px, 0px)">
<polygon points="60.2,89 79.2,100 60.2,111" style="fill: #FF5500; stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: round"></polygon>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"frame":{"editor":"int","default":4,"min":1,"max":6},"size":{"editor":"int","default":240,"min":40,"max":800},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const F = {
      1: { slabO: 1, slabY: 8, botO: 0, botY: -120, topO: 0, topY: -140, wedO: 0, wedX: -14, trace: '#FFFFFF' },
      2: { slabO: 1, slabY: 0, botO: 0.85, botY: -70, topO: 0, topY: -140, wedO: 0, wedX: -14, trace: '#FFFFFF' },
      3: { slabO: 1, slabY: 0, botO: 1, botY: 0, topO: 0.85, topY: -80, wedO: 0, wedX: -14, trace: '#FFFFFF' },
      4: { slabO: 1, slabY: 0, botO: 1, botY: 0, topO: 1, topY: 0, wedO: 0.6, wedX: -8, trace: '#FFFFFF' },
      5: { slabO: 1, slabY: 0, botO: 1, botY: 0, topO: 1, topY: 0, wedO: 1, wedX: 0, trace: '#0D0D0D' },
      6: { slabO: 1, slabY: 0, botO: 1, botY: 0, topO: 1, topY: -7, wedO: 1, wedX: 0, trace: '#0D0D0D' }
    };
    const n = Math.min(6, Math.max(1, Number(this.props.frame ?? 4) || 4));
    const size = Number(this.props.size ?? 240) || 240;
    return { f: F[n], px: size + 'px', label: 'Logo build-up, frame ' + n };
  }
}
</script>
</body>
</html>
