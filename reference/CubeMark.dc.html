<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["c1","c2","c3","c4","c5","c6","c7","c8"],"default":"c1"},"pal":{"editor":"enum","options":["p2","site","bell","p1"],"default":"p2"},"bg":{"editor":"enum","options":["dark","light"],"default":"dark"},"size":{"editor":"int","default":320,"min":16,"max":1200},"clear":{"editor":"boolean","default":false},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      p2: {
        dark: { bg: '#0D0D0D', top: '#FFFFFF', left: '#F97316', right: '#FF5500' },
        light: { bg: '#FFFFFF', top: '#F97316', left: '#FF5500', right: '#0D0D0D' }
      },
      site: {
        dark: { bg: '#060A12', top: '#22D3FF', left: '#4A8DFF', right: '#8B5CFF' },
        light: { bg: '#FFFFFF', top: '#0891B2', left: '#2F6FED', right: '#7C3AED' }
      },
      p1: {
        dark: { bg: '#0A0A0F', top: '#A78BFA', left: '#8B5CF6', right: '#6D28D9' },
        light: { bg: '#FFFFFF', top: '#8B5CF6', left: '#6D28D9', right: '#1E3A8A' }
      },
      bell: {
        dark: { bg: '#070B14', top: '#EAF2FF', left: '#3D7BFF', right: '#1E2F7A', a1: '#FFD08A', a2: '#FFB547', a3: '#D9831A' },
        light: { bg: '#FFFFFF', top: '#8DB8FF', left: '#2F66F0', right: '#0B1530', a1: '#FFC266', a2: '#F59E0B', a3: '#B45309' }
      }
    };
    const pal = P[this.props.pal] ? this.props.pal : 'p2';
    Object.keys(P).forEach((k) => ['dark', 'light'].forEach((b) => {
      const t = P[k][b];
      if (!t.a1) { t.a1 = t.top; t.a2 = t.left; t.a3 = t.right; }
    }));
    const bg = this.props.bg === 'light' ? 'light' : 'dark';
    const v = this.props.variant || 'c1';
    const size = Number(this.props.size ?? 320) || 320;
    return {
      c: P[pal][bg],
      px: size + 'px',
      fill: (this.props.clear === true || this.props.clear === 'true') ? 'transparent' : P[pal][bg].bg,
      is1: v === 'c1', is2: v === 'c2', is3: v === 'c3', is4: v === 'c4',
      is5: v === 'c5', is6: v === 'c6', is7: v === 'c7', is8: v === 'c8'
    };
  }
}
